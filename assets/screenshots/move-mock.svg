<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect x="54" y="40" width="852" height="520" rx="44" fill="url(#bg)"/>
  <rect x="86" y="70" width="788" height="460" rx="34" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <rect x="118" y="102" width="724" height="56" rx="18" fill="url(#card)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <text x="158" y="136" font-family="ui-sans-serif, system-ui, -apple-system" font-size="20" font-weight="900" fill="rgba(255,255,255,0.90)">Move</text>

  <!-- map -->
  <rect x="118" y="175" width="724" height="272" rx="26" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
  <path d="M160 380 C 240 320, 320 420, 400 360 C 480 300, 560 410, 640 350" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="6" stroke-linecap="round"/>

  <!-- user marker -->
  <circle cx="330" cy="350" r="18" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
  <circle cx="330" cy="350" r="7" fill="rgba(255,255,255,0.75)"/>

  <!-- goal marker -->
  <rect x="610" y="290" width="46" height="46" rx="18" fill="rgba(249,115,22,0.35)" stroke="rgba(249,115,22,0.55)" stroke-width="2"/>
  <circle cx="633" cy="313" r="7" fill="rgba(249,115,22,0.95)"/>

  <rect x="118" y="462" width="724" height="34" rx="14" fill="rgba(0,0,0,0.16)" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
  <text x="150" y="484" font-family="ui-sans-serif, system-ui, -apple-system" font-size="16" font-weight="900" fill="rgba(255,255,255,0.85)">Walk to the goal marker</text>
</svg>

