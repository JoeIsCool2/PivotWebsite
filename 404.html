<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Pivot</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#80deea" />
    <link rel="icon" type="image/png" href="assets/app-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600&family=Outfit:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .err {
        min-height: 70vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem 1.25rem;
      }
      .err h1 {
        font-family: var(--font-display);
        font-size: clamp(1.75rem, 4vw, 2.25rem);
        margin: 0 0 0.75rem;
      }
      .err p {
        color: var(--text-muted);
        margin: 0 0 1.5rem;
        max-width: 36ch;
      }
    </style>
  </head>
  <body>
    <div class="err">
      <h1>This page isn’t here.</h1>
      <p>The link may be wrong or the page moved.</p>
      <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center">
        <a class="btn btn--primary" href="./">Back to Pivot</a>
        <a class="btn btn-secondary" href="support.html">Get help</a>
      </div>
    </div>
  </body>
</html>
